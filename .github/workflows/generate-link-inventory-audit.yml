name: Regenerate full-source external-link inventory (audit branch)
on:
  push:
    branches:
      - audit/full-source-link-inventory-final-20261030
    paths-ignore:
      - data/external-link-inventory-2026-10-30.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate inventory from the full active-source scan
        run: node scripts/generate-external-link-inventory.cjs --output=data/external-link-inventory-2026-10-30.json
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external-link-inventory-2026-10-30.json
          if git diff --cached --quiet; then
            echo "Inventory is already current."
          else
            git commit -m "Regenerate full-source external link inventory"
            git push
          fi
