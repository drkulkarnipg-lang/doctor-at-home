name: One-time external-link inventory regeneration

on:
  push:
    branches:
      - fix/mobile-language-article-fee-20261031
    paths:
      - .github/workflows/regenerate-link-inventory-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate inventory from the exact checked-out source
        run: node scripts/generate-external-link-inventory.cjs --output=data/external-link-inventory-2026-10-30.json
      - name: Commit only the generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external-link-inventory-2026-10-30.json
          if git diff --cached --quiet; then
            echo "The committed inventory is already current."
            exit 0
          fi
          git commit -m "Regenerate external-link inventory from active source"
          git push
