name: Refresh complete link inventory (one-time)

on:
  push:
    branches:
      - 'audit/run-external-link-check-inventory-refresh-20261030'
    paths-ignore:
      - 'data/external-link-inventory-2026-10-30.json'
      - '.github/workflows/refresh-link-inventory-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == 'audit/run-external-link-check-inventory-refresh-20261030'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate full source inventory
        run: npm run inventory:links -- --output=data/external-link-inventory-2026-10-30.json
      - name: Commit inventory and remove one-time workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-link-inventory-once.yml
          git add data/external-link-inventory-2026-10-30.json
          git commit -m "Refresh full current-source external-link inventory"
          git push origin "HEAD:${BRANCH_NAME}"
