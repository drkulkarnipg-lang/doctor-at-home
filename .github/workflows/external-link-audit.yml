name: External link audit (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/run-external-link-check-*'

permissions:
  contents: read

concurrency:
  group: external-link-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-public-destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate current source inventory
        run: |
          mkdir -p reports
          npm run inventory:links -- --output=reports/external-link-inventory-${{ github.run_id }}.json
      - name: Check public external destinations
        run: |
          npm run audit:links -- --inventory=reports/external-link-inventory-${{ github.run_id }}.json --concurrency=3 --timeout=10000 --output=reports/external-link-check-${{ github.run_id }}.json
      - name: Print unresolved destination details
        if: success()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/external-link-check-${{ github.run_id }}.json', 'utf8'));
          const unresolved = report.results.filter(item => !['reachable', 'skipped'].includes(item.outcome));
          console.log(JSON.stringify(unresolved.map(({url, source_files, outcome, http_status, final_url, method, reason, error}) => ({url, source_files, outcome, http_status, final_url, method, reason, error})), null, 2));
          NODE
      - name: Upload inventory and link-check report
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit-${{ github.run_id }}
          path: |
            reports/external-link-inventory-${{ github.run_id }}.json
            reports/external-link-check-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
